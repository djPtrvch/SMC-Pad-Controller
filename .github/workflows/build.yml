# Firmware (JieLi toolchain, via open-smc-pad's Boards Manager package) and the web configurator.
# Every push: host tests, firmware .bin (artifact), web tests and build.
# main or a manual run: the configurator (with the firmware inside) goes to GitHub Pages.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SMCPAD_INDEX: https://github.com/fedepaj/open-smc-pad/releases/download/v0.1.1/package_smcpad_index.json

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/host/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vectors
          path: tests/vectors/vectors.json

  firmware:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the SMC-PAD platform (open-smc-pad v0.1.1)
        run: |
          arduino-cli core update-index --additional-urls "$SMCPAD_INDEX"
          arduino-cli core install smcpad:br25 --additional-urls "$SMCPAD_INDEX"
      - name: Compile
        run: |
          arduino-cli compile --fqbn smcpad:br25:smcpad --warnings default --output-dir build/fw firmware/JamboPad
          ls -la build/fw
          mkdir -p dist && cp build/fw/JamboPad.ino.bin dist/jambopad.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/jambopad.bin

  # the open-smc-pad bootloader and the first-install images (tools/make_install.py)
  install-images:
    runs-on: ubuntu-latest
    env:
      OSP_TAG: v0.1.1
      TOOLCHAIN_URL: https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz
      TOOLCHAIN_SHA256: a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd
      # sdk/fw-AC63_BT_SDK at open-smc-pad v0.1.1: only cfg_tool.bin is needed
      CFG_TOOL_URL: https://raw.githubusercontent.com/Jieli-Tech/fw-AC63_BT_SDK/fdc018de81629e21e594d677cf05f87d288be0f0/cpu/br25/tools/cfg_tool.bin
    steps:
      - uses: actions/checkout@v4
      - name: open-smc-pad sources
        run: |
          git clone --depth 1 --branch "$OSP_TAG" https://github.com/fedepaj/open-smc-pad osp
          git -C osp submodule update --init --depth 1 third_party/tinyusb || git -C osp submodule update --init third_party/tinyusb
          mkdir -p osp/sdk/fw-AC63_BT_SDK/cpu/br25/tools
          curl -sfL -o osp/sdk/fw-AC63_BT_SDK/cpu/br25/tools/cfg_tool.bin "$CFG_TOOL_URL"
      - name: JieLi toolchain (from JieLi, checked)
        run: |
          mkdir -p osp/tools/jl-toolchain
          curl -sfL -o tc.tar.xz "$TOOLCHAIN_URL" && echo "$TOOLCHAIN_SHA256  tc.tar.xz" | sha256sum -c
          tar -xJf tc.tar.xz -C osp/tools/jl-toolchain
          ls osp/tools/jl-toolchain
      - name: Build the bootloader and the installer (fw/boot)
        run: |
          # open-smc-pad v0.1.1: fw/smcpad/usb/dcd_br25.c includes smcpad_spin.h, which fw/boot/build.sh
          # does not reach (it is in fw/smcpad/include and pulls the application's app_config.h). The
          # bootloader runs on the uboot's clock, for which the waits were tuned before that header
          # existed: scale 1, as before.
          printf '#pragma once\n#define SMCPAD_SPIN(n) (n)\n' > osp/fw/boot/include/smcpad_spin.h
          docker build -t jl-build -f osp/docker/Dockerfile.jl-build osp/docker
          osp/fw/boot/build.sh
      - name: Package
        run: |
          cd osp
          python3 host/jlimage.py build --app fw/boot/out/boot.bin --area-base 0x1000 \
            --vm-base 0x71000 --vm-size 0x4000 --prct-size 0x71000 --out work/flash/boot_area.bin
          cd ..
          python3 tools/make_install.py osp dist/install
          ls -la dist/install
      - uses: actions/upload-artifact@v4
        with:
          name: install
          path: dist/install

  web:
    needs: [firmware, install-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/public/firmware
      - uses: actions/download-artifact@v4
        with:
          name: install
          path: web/public/install
      - name: Test and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
